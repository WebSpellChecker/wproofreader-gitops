# Product charts pinned to release tags.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mysql-server-helm
spec:
  interval: 10m
  url: https://github.com/WebSpellChecker/mysql-server-helm
  ref:
    tag: v1.0.0   # chart 1.0.0; MySQL 8.4 is set in the values file
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: wproofreader-helm
spec:
  interval: 10m
  url: https://github.com/WebSpellChecker/wproofreader-helm
  ref:
    tag: v1.4.0   # chart 1.4.0, WProofreader Server 6.18.1.0
  ignore: |
    # put only the chart directory in the artifact
    /*
    !/wproofreader/
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: admin-panel-helm
spec:
  interval: 10m
  url: https://github.com/WebSpellChecker/admin-panel-helm
  ref:
    tag: v1.0.0   # chart 1.0.0, Admin-panel 3.0.0
  ignore: |
    /*
    !/admin-panel/
