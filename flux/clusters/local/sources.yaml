# Layer 0: the sources every other layer pulls from (chart repos with pinned revisions).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: wproofreader-gitops
  path: ./flux/sources
  prune: true
  wait: true   # Ready once every GitRepository/HelmRepository has fetched an artifact
