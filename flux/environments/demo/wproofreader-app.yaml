# WProofreader Server and db-manager provisioning (a pre-install/pre-upgrade hook that Helm runs). The release name is fixed: Admin-panel routes /wscservice to this Service name.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wproofreader-app
spec:
  interval: 10m
  timeout: 15m                 # hook Jobs wait for their database themselves
  releaseName: wproofreader-app
  dependsOn:
    - name: mysql
  chart:
    spec:
      chart: ./wproofreader
      sourceRef:
        kind: GitRepository
        name: wproofreader-helm
        namespace: flux-system
      reconcileStrategy: Revision   # re-package on every pinned-revision change, even without a Chart.yaml version bump
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: wproofreader-app-values
