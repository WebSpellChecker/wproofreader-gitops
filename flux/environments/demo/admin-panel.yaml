# Admin-panel (web, worker, scheduler, and the migration hook).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: admin-panel
spec:
  interval: 10m
  timeout: 15m                 # hook Jobs wait for their database themselves
  releaseName: admin-panel
  dependsOn:
    - name: mysql
    - name: wproofreader-app
  chart:
    spec:
      chart: ./admin-panel
      sourceRef:
        kind: GitRepository
        name: admin-panel-helm
        namespace: flux-system
      reconcileStrategy: Revision   # re-package on every pinned-revision change, even without a Chart.yaml version bump
      interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: admin-panel-values
