name: Secret scan

# Fails the build if a secret is committed. Runs on every PR and on pushes to the
# integration branches.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  scan:
    # The job name is the required check of the development and main rulesets.
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so gitleaks/trufflehog scan all commits

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.29.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --output checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - name: trufflehog (verified live credentials)
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/v3.97.5/scripts/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/bin" v3.97.5
          "$RUNNER_TEMP/bin/trufflehog" git "file://$GITHUB_WORKSPACE" \
            --only-verified --fail --no-update
