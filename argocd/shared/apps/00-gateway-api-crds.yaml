# Wave -3: Gateway API CRDs (must exist before any controller or Gateway/HTTPRoute).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: shared
  source:
    repoURL: https://github.com/WebSpellChecker/wproofreader-gitops
    targetRevision: main
    path: argocd/shared/gateway-api-crds
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system                       # CRDs are cluster-scoped; namespace is only a placeholder
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # don't prune cluster-wide CRDs automatically
    syncOptions:
      - ServerSideApply=true                       # CRDs are large; SSA avoids the annotation-size limit
