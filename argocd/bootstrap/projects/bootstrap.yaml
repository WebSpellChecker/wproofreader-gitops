# Admin-owned project for everything that creates Argo CD Applications: the `shared`
# App-of-Apps and the per-environment stack App-of-Apps generated by the ApplicationSet.
# Deploying into the argocd namespace is admin-level access, so only this project may.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Bootstrap layer — App-of-Apps parents only. Admin-owned.
  sourceRepos:
    - https://github.com/WebSpellChecker/wproofreader-gitops
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
  clusterResourceWhitelist: []
