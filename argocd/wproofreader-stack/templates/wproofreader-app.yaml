# Wave 2: WProofreader Server + db-manager provisioning (pre-install/pre-upgrade hook -> PreSync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.environment }}-wproofreader-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the Application removes its workloads (PVCs stay)
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: wproofreader
  sources:
    - repoURL: {{ .Values.charts.wproofreader.repoURL }}
      targetRevision: {{ .Values.charts.wproofreader.revision }}
      path: wproofreader
      helm:
        releaseName: wproofreader-app  # fixed: Admin-panel routes /wscservice to this Service name
        valueFiles:
          - $values/argocd/environments/{{ .Values.environment }}/wproofreader-app.yaml
    {{ include "stack.valuesSource" . | nindent 4 }}
  destination:
    {{- include "stack.destination" . | nindent 4 }}
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:                                   # waves between Applications are best-effort on first sync; retry instead of staying Failed
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
