# Argo CD dropped the built-in health check for the Application kind in 1.8. Without it,
# App-of-Apps sync waves only order the *creation* of child Applications and never wait
# for them to become Healthy. Apply once after installing Argo CD:
#
#   kubectl -n argocd patch cm argocd-cm --type merge --patch-file argocd/argocd-cm-health-patch.yaml
#
# Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/health/#argocd-app
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
