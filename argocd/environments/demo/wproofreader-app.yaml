# wproofreader-app: WProofreader Server and the db-manager provisioning hook.
# The image tags default to the chart appVersion.
licenseExistingSecret: wproofreader-license   # key: license
database:
  enabled: true
  host: mysql-primary.wsc.svc.cluster.local
  existingSecret: wproofreader-db   # keys: root-password, appserver-password, admin-panel-password
databaseProvisioning:
  enabled: true
  rootUser: root
